---
- name: Create meow-bot static subdirectory
  ansible.builtin.file:
    path: "{{ nginx_html_path }}/static/meow-bot"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: yes

- name: Sync meow-bot static files to nginx
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/"
    dest: "{{ nginx_html_path }}/static/meow-bot/"
    delete: yes
    recursive: yes
    checksum: yes
  become: yes

- name: Compute meow-bot static file version hashes
  ansible.builtin.set_fact:
    meow_bot_static_file_versions: >-
      {{ meow_bot_static_file_versions | default({}) | combine(
        {item: (lookup('file', role_path + '/files/' + item) | hash('md5'))[:8]}
      ) }}
  loop:
    - js/meow-bot-pp.js
    - js/meow-bot-tos.js
    - js/i18n.js
    - css/index.css

- name: Deploy meow-bot HTML pages from templates
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ nginx_html_path }}/static/meow-bot/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  become: yes
  loop:
    - meow-bot-pp.html
    - meow-bot-tos.html

# The bot's /health used to be proxied publicly behind Basic Auth; nothing used
# it (the deploy check and the blackbox probe both hit 127.0.0.1). Remove what
# earlier runs left on the hosts.
- name: Remove the public health endpoint htpasswd file
  ansible.builtin.file:
    path: "{{ nginx_htpasswd_path }}/meow-bot-health.htpasswd"
    state: absent
  become: yes
  notify: Restart Nginx container

# discord-bot-locations.conf now holds only the Twitch EventSub webhook location
# (it replaces the old public /health one); hosts without the webhook get none.
- name: Deploy the Twitch EventSub webhook nginx location
  ansible.builtin.template:
    src: discord-bot-locations.conf.j2
    dest: "{{ nginx_custom_locations_path }}/discord-bot-locations.conf"
    mode: "0644"
  become: yes
  when: twitch_eventsub_callback_url | length > 0
  notify: Restart Nginx container

- name: Remove the Twitch EventSub webhook nginx location when it is disabled
  ansible.builtin.file:
    path: "{{ nginx_custom_locations_path }}/discord-bot-locations.conf"
    state: absent
  become: yes
  when: twitch_eventsub_callback_url | length == 0
  notify: Restart Nginx container
...
